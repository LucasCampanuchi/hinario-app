<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Hinário digital com hinos e cânticos" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!-- Preload recursos críticos -->
    <link rel="preload" href="main.dart.js" as="script" />
    <link rel="preload" href="favicon.png" as="image" />
    
    <!-- DNS prefetch para recursos externos -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Hinario" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Hinario</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        margin: 0;
        background-color: #3e5a86;
      }
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        transition: opacity 0.3s ease-out;
      }
      .loading-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
        border-radius: 12px;
      }
      .loading-spinner {
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      .loading-text {
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        font-size: 24px;
        font-weight: 300;
        margin-top: 20px;
        letter-spacing: 1px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">
      <img src="favicon.png" alt="Cifras" class="loading-logo" />
      <div class="loading-spinner"></div>
      <div class="loading-text">Cifras</div>
    </div>

    <script>
      var serviceWorkerVersion = '{{flutter_service_worker_version}}' || null;
      var scriptLoaded = false;

      // Tratamento global de erros
      window.addEventListener('error', function(e) {
        console.warn('Erro capturado:', e.message);
      });

      function loadMainDartJs() {
        if (scriptLoaded) {
          return;
        }
        scriptLoaded = true;
        
        try {
          var scriptTag = document.createElement('script');
          scriptTag.src = 'main.dart.js';
          scriptTag.type = 'application/javascript';
          scriptTag.onerror = function() {
            console.warn('Erro ao carregar main.dart.js');
          };
          document.body.append(scriptTag);

          // Remove loading assim que o Flutter estiver pronto
          setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading && loading.parentNode) {
              loading.style.opacity = '0';
              setTimeout(() => {
                if (loading.parentNode) {
                  loading.remove();
                }
              }, 300);
            }
          }, 800);
        } catch (e) {
          console.warn('Erro no loadMainDartJs:', e);
        }
      }

      // Carrega imediatamente sem esperar o service worker
      try {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadMainDartJs);
        } else {
          loadMainDartJs();
        }
      } catch (e) {
        console.warn('Erro no carregamento inicial:', e);
        loadMainDartJs();
      }
      
      // Service worker em paralelo (não bloqueia o carregamento)
      if ('serviceWorker' in navigator && serviceWorkerVersion) {
        window.addEventListener('load', function () {
          try {
            var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
            navigator.serviceWorker.register(serviceWorkerUrl).catch(function(error) {
              console.warn('Service worker registration failed:', error);
            });
          } catch (e) {
            console.warn('Erro no service worker:', e);
          }
        });
      }
    </script>
  </body>
</html>
